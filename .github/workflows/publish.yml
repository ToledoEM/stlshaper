name: Deploy Docs

# Only main publishes. Pushes to dev must never redeploy the public site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Renders documentation.qmd and copies the app (index.html, main.js,
      # worker.js, libraries/, default STL) alongside it — see the `resources`
      # list in _quarto.yaml. Without those the deployed page loads scripts
      # that 404.
      - name: Render
        run: quarto render

      - name: Verify the app was included
        run: |
          for f in index.html main.js worker.js documentation.html; do
            if [ ! -e "_site/$f" ]; then
              echo "::error::_site/$f missing — the deployed site would be broken"
              exit 1
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
